# Starter: arbeitet starter/auftrag.txt ab und stößt die eigentlichen
# Workflows per workflow_dispatch an (GITHUB_TOKEN darf das — Ausnahme
# von der „Token löst keine Runs aus“-Regel). Zeilenformat:
#   <workflow-datei>;<input>=<wert>;<input>=<wert>…   (# = Kommentar)
# Genutzt vom CRM-Chat (Claude), wenn der App-Token keine Dispatches darf.
name: starter
on:
  push:
    branches: [main]
    paths: ['starter/auftrag.txt']
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Aufträge anstoßen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=0
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%%#*}"; line="$(echo "$line" | sed 's/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            IFS=';' read -ra teile <<< "$line"
            wf="${teile[0]}"; args=()
            for kv in "${teile[@]:1}"; do args+=(-f "$kv"); done
            echo "→ $wf ${args[*]}"
            if gh workflow run "$wf" --ref main "${args[@]}"; then n=$((n+1)); else echo "::warning::Dispatch fehlgeschlagen: $line"; fi
            sleep 2
          done < starter/auftrag.txt
          echo "## Starter: $n Läufe angestoßen" >> "$GITHUB_STEP_SUMMARY"
