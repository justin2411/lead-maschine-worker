name: suchlauf

# M2: OSM-Extract-Suchlauf. Die App (Fabrik 2 im CRM) startet diesen
# Workflow per workflow_dispatch; der Worker lädt den Geofabrik-Extract,
# filtert die POI-Familien mit osmium vor, scannt mit pyosmium nach der
# Branche und meldet Treffer + Förderband an die App zurück.
#
# Secrets (Repo-Settings → Secrets and variables → Actions):
#   APP_URL       z. B. https://4570-98.vercel.app
#   WORKER_TOKEN  = FABRIK2_WORKER_TOKEN der App (Fallback: ADMIN_API_TOKEN)
#
# Datenquelle: © OpenStreetMap contributors (ODbL 1.0).
on:
  workflow_dispatch:
    inputs:
      branche:
        description: "Branchen-Schlüssel aus worker/branchen.py — mehrere per Komma (spart den 4-GB-Download je Lauf)"
        required: true
      quellen:
        description: "Komma-Liste der Quellen (M2: nur osm)"
        default: "osm"
      suchlauf_id:
        description: "fabrik2_suchlaeufe-Zeile je Branche, gleiche Reihenfolge (Komma)"
        required: true
      limit:
        description: "max. gemeldete Treffer (0 = alle)"
        default: "0"
      maps_ab:
        description: "Karten-Lauf: Städte-Versatz in STAEDTE (Folgeläufe decken weitere Städte ab)"
        default: "0"

jobs:
  suchlauf:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Go nur für den optionalen Karten-Lauf (gosom); schadet sonst nicht
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Werkzeuge installieren (osmium-tool + pyosmium + leadkern)
        env:
          LEADKERN_TOKEN: ${{ secrets.LEADKERN_TOKEN }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install --quiet osmium pypdf
          if [ -n "$LEADKERN_TOKEN" ]; then
            pip install --quiet "leadkern @ git+https://x-access-token:${LEADKERN_TOKEN}@github.com/justin2411/leadkern@main"
          else
            pip install --quiet "leadkern @ git+https://github.com/justin2411/leadkern@main"
          fi

      - name: OSM-Extract-Suchlauf
        env:
          APP_URL: ${{ secrets.APP_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: |
          python worker/osm_extract.py \
            --branche "${{ github.event.inputs.branche }}" \
            --quellen "${{ github.event.inputs.quellen }}" \
            --suchlauf-id "${{ github.event.inputs.suchlauf_id }}" \
            --limit "${{ github.event.inputs.limit }}"

      # M5 (D-089): freigegebene Verbandsquellen — läuft nur, wenn die
      # angeforderten Quellen einen verband_*-Schlüssel der Branche enthalten
      - name: Verbandsquellen
        env:
          APP_URL: ${{ secrets.APP_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python worker/verbaende.py \
            --branche "${{ github.event.inputs.branche }}" \
            --quellen "${{ github.event.inputs.quellen }}" \
            --suchlauf-id "${{ github.event.inputs.suchlauf_id }}" \
            --limit "${{ github.event.inputs.limit }}"

      # Karten-Lauf (D-092) — gosom/Google-Maps, NUR wenn 'maps' angefordert.
      # Bewusste Ausnahme (Google-ToS); gedrosselt, kein Proxy/Captcha-Solver.
      - name: gosom-Binary bereitstellen
        if: contains(github.event.inputs.quellen, 'maps')
        run: |
          go install github.com/gosom/google-maps-scraper@latest || true
          if [ -f "$(go env GOPATH)/bin/google-maps-scraper" ]; then
            cp "$(go env GOPATH)/bin/google-maps-scraper" ./google-maps-scraper
          fi
          # Playwright-Browser für gosom
          ./google-maps-scraper -install-playwright 2>/dev/null || true

      - name: Karten-Lauf
        if: contains(github.event.inputs.quellen, 'maps')
        env:
          APP_URL: ${{ secrets.APP_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          GOSOM_BIN: ./google-maps-scraper
          FABRIK2_MAPS_MAX_STAEDTE: ${{ vars.FABRIK2_MAPS_MAX_STAEDTE }}
          FABRIK2_MAPS_STAEDTE_AB: ${{ github.event.inputs.maps_ab }}
        run: |
          python worker/maps_lauf.py \
            --branche "${{ github.event.inputs.branche }}" \
            --quellen "${{ github.event.inputs.quellen }}" \
            --suchlauf-id "${{ github.event.inputs.suchlauf_id }}" \
            --limit "${{ github.event.inputs.limit }}"

      # Brave-Suche (D-091) — geteiltes Kontingent mit Fabrik 1, nur auf Anforderung
      - name: Brave-Suche
        env:
          APP_URL: ${{ secrets.APP_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          FABRIK2_BRAVE_MAX_ANFRAGEN: ${{ vars.FABRIK2_BRAVE_MAX_ANFRAGEN }}
        run: |
          python worker/brave_suche.py \
            --branche "${{ github.event.inputs.branche }}" \
            --quellen "${{ github.event.inputs.quellen }}" \
            --suchlauf-id "${{ github.event.inputs.suchlauf_id }}" \
            --limit "${{ github.event.inputs.limit }}"

      # E-3 = Stapel-Modus Pflicht: nach dem Suchlauf automatisch anreichern
      - name: Stapel-Anreicherung (automatisch, E-3)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANREICHERUNG_MAX_PRO_LAUF: ${{ vars.ANREICHERUNG_MAX_PRO_LAUF }}
        run: |
          python worker/anreicherung.py \
            --suchlauf-id "${{ github.event.inputs.suchlauf_id }}"
