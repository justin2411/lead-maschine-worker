# Quellen-Scout (D-138): sucht öffentliche Hebammen-Listen, zapft nichts an.
# Ergebnis: Job-Log (Rangliste) + Artefakt scout-ergebnis.json.
name: scout
on:
  workflow_dispatch:
    inputs:
      max_kandidaten:
        description: "höchstens so viele Kandidaten abrufen (1 Abruf je Kandidat, 1/s)"
        default: "150"
        required: false
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pypdf
      - name: Scout
        run: python worker/scout.py "${{ github.event.inputs.max_kandidaten }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-ergebnis
          path: scout-ergebnis.json
          if-no-files-found: ignore
