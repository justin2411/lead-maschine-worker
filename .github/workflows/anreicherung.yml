name: anreicherung

# M3: Stapel-Anreicherung auf Zuruf — für einen ganzen Suchlauf, eine
# einzelne Firma ODER eine ganze Zielgruppe (branche, alle rohen Firmen
# über alle Suchläufe — Justin, 31.08.2026).
# Der automatische Stapel nach jedem Suchlauf steckt in suchlauf.yml.
#
# Secrets: APP_URL, WORKER_TOKEN (Pflicht) · ANTHROPIC_API_KEY (optional,
# Module 7+10 — ohne Key laufen die Regeln allein) · LEADKERN_TOKEN
# (nur nötig, solange justin2411/leadkern privat ist).
on:
  workflow_dispatch:
    inputs:
      suchlauf_id:
        description: "fabrik2_suchlaeufe-Zeile (ganzer Lauf)"
        required: false
      firma_id:
        description: "einzelne fabrik2_firmen-Zeile"
        required: false
      branche:
        description: "ganze Zielgruppe (Branchen-Label; alle rohen Firmen)"
        required: false
      limit:
        description: "max. Firmen (0 = bis zum Deckel ANREICHERUNG_MAX_PRO_LAUF)"
        default: "0"
      kette:
        description: "Ketten-Runden: nach dem Stapel erneut starten, solange rohe Firmen offen sind (0 = aus)"
        default: "0"

permissions:
  actions: write
  contents: read

jobs:
  anreicherung:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: leadkern installieren
        env:
          LEADKERN_TOKEN: ${{ secrets.LEADKERN_TOKEN }}
        run: |
          if [ -n "$LEADKERN_TOKEN" ]; then
            pip install --quiet "leadkern @ git+https://x-access-token:${LEADKERN_TOKEN}@github.com/justin2411/leadkern@main"
          else
            pip install --quiet "leadkern @ git+https://github.com/justin2411/leadkern@main"
          fi

      - name: Stapel-Anreicherung
        id: stapel
        env:
          APP_URL: ${{ secrets.APP_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANREICHERUNG_MAX_PRO_LAUF: ${{ vars.ANREICHERUNG_MAX_PRO_LAUF }}
        run: |
          python worker/anreicherung.py \
            --suchlauf-id "${{ github.event.inputs.suchlauf_id }}" \
            --firma-id "${{ github.event.inputs.firma_id }}" \
            --branche "${{ github.event.inputs.branche }}" \
            --limit "${{ github.event.inputs.limit }}"

      # Ketten-Modus (Justin, 06.09.2026): solange die Zielgruppe/der
      # Suchlauf noch rohe Firmen hat und Runden übrig sind, den nächsten
      # Stapel selbst anstoßen. `kette` zählt die verbleibenden Runden
      # herunter — harter Riegel gegen Endlosschleifen.
      - name: Nächsten Stapel anstoßen
        if: ${{ steps.stapel.outputs.rest != '0' && github.event.inputs.kette != '0' && github.event.inputs.kette != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rest_runden=$(( ${{ github.event.inputs.kette }} - 1 ))
          if [ "$rest_runden" -le 0 ]; then
            echo "Ketten-Runden aufgebraucht — Stopp." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run anreicherung.yml --ref "$GITHUB_REF_NAME" \
            -f suchlauf_id="${{ github.event.inputs.suchlauf_id }}" \
            -f firma_id="${{ github.event.inputs.firma_id }}" \
            -f branche="${{ github.event.inputs.branche }}" \
            -f limit="${{ github.event.inputs.limit }}" \
            -f kette="$rest_runden"
          echo "Kette: nächster Stapel angestoßen ($rest_runden Runden übrig)" >> "$GITHUB_STEP_SUMMARY"
